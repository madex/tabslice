services:
  tabslice:
    build:
      context: .
      dockerfile: Dockerfile
    image: tabslice:latest
    container_name: tabslice
    restart: unless-stopped
    init: true
    ports:
      - "${TABSLICE_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      # Persistent runtime data: uploaded slices, index and SoundFont cache.
      - ./data:/app/data
      # Drop folder for Guitar Pro files placed directly on the server.
      - ./scores:/app/scores
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
